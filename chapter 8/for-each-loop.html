<body>
  <script>
    // let arr = [3,5,7,9];
    // for(let i = 0 ; i < arr.length ; i++){
    //   console.log(arr[i]);
    // }
    // arr.forEach(num =>
    //   console.log(num));

    let arr = [1,2,3,4,5,6,7,8,9];
    // Return works as continue statement in For Each loop
    arr.forEach( num => {
      if(num === 5){
        return;
      }
      console.log(`Visited: ${num}`);
    } );




    function search(arr, num){
      for(let i = 0 ; i < arr.length ; i++){
        if (arr[i] === num){
          console.log(`Element found at: ${i}`);
          return;
        }
      }
      console.log('Element was not found!');
    }  

    search(arr, 3);
  </script>
</body>
