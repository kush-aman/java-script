<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Set Chapter 8</title>
  <style>
    .my-button{
      font-size: 15px;
      height: 20px;
      width: 80px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .szie-double{
      font-size: 30px;
      height: 40px;
      width: 160px;
    }
  </style>
</head>
<body>
  <button class="my-button">Click Me</button>
  <script>
    let buttonElement = document.querySelector('.my-button');
    buttonElement.addEventListener('click', event => 
      setTimeout(doubleTheSize, 2000));

    function doubleTheSize(){
      let buttonElement = document.querySelector('.my-button');
      buttonElement.classList.add('.size-double');
    }



    let arr = [1,2,3,4,3,2,3,4];
    let sum = 0;
    arr.forEach(num => sum += num);
    console.log(sum);



    let multiply = (num1,num2) => num1 * num2;
    console.log(multiply(3,4));

    let printGreeting = () => console.log('Namaste');
    let runTwice = inputFunction => {
      inputFunction();
      inputFunction();
    }
    runTwice(printGreeting);



    let arr1 = [2,3,4,3,5,6,7];
    let squares = arr1.map(num => num * num);
    console.log(squares);
  </script>
</body>
</html>
