<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Functions</title>
</head>
<body>
  <script>
    // let sum = function(num1, num2){
    //   return num1 + num2;
    // }

    let sum = (num1, num2) => {
      return num1 + num2;
    }

    console.log(sum(6,5));

    // single argument does not require to be closed inside the square brackets
    let square1 = num => {
      return num * num;
    }

    // if defination is of one line then return and curly brackets are also optional
    let square2 = num => num * num;
  </script>
</body>
</html>
