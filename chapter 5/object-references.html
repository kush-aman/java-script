<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object References</title>
</head>
<body>
  <script>
    let a = 5;
    let b = a;
    console.log(`a=${a} , b=${b}`);
    a = 8;
    console.log(`a=${a} , b=${b}`);

    let x = {num: 5};
    let y = x;
    console.log(`x=${x} , y=${y}`);
    x.num = 8;
    console.log(`x=${x} , y=${y}`);

    let p = {pop: 'iujh'};
    let q = {pop: 'iujh'};
    console.log(p == q); //False because in case of object, it will compare the data address of p and q which is not same.
    console.log(p === q); //False


    //De-structuring object
    let product = {
      company: 'Mango',
      price: 861,
      'item-name': 'T-shirt',
    };

    let {company , price} = product;
    console.log(company);
    console.log(price);

    
    
  </script>
</body>
</html>
